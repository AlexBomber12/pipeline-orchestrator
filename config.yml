repositories:
- url: https://github.com/AlexBomber12/pipeline-orchestrator.git
  branch: main
  auto_merge: true
  active: true
  poll_interval_sec: 60
  allow_merge_without_checks: false
  allow_merge_without_review: false
  coder: codex
  # Routes dispatcher decisions through the unified WorkInhibitor helper;
  # per-repo overrides to false remain available for targeted rollback.
  feature_flags:
    use_unified_inhibitor_check: true
    use_single_error_exit: false
- url: https://github.com/AlexBomber12/megaraid-dashboard
  branch: main
  auto_merge: true
  active: true
  poll_interval_sec: 60
  allow_merge_without_checks: false
  allow_merge_without_review: false
  coder: codex
  # Routes dispatcher decisions through the unified WorkInhibitor helper;
  # per-repo overrides to false remain available for targeted rollback.
  feature_flags:
    use_unified_inhibitor_check: true
    use_single_error_exit: false
- url: https://github.com/AlexBomber12/sms-gateway-v2
  branch: main
  auto_merge: true
  active: true
  poll_interval_sec: 60
  allow_merge_without_checks: false
  allow_merge_without_review: false
  coder: codex
  # Routes dispatcher decisions through the unified WorkInhibitor helper;
  # per-repo overrides to false remain available for targeted rollback.
  feature_flags:
    use_unified_inhibitor_check: true
    use_single_error_exit: false
daemon:
  poll_interval_sec: 60
  review_timeout_min: 20
  stale_review_threshold_min: 10
  stale_review_threshold_eyes_min: 5
  hung_fallback_codex_review: true
  error_handler_use_ai: true
  claude_model: opus
  fix_idle_timeout_sec: 1800
  fix_iteration_cap: 25
  fix_no_push_cap: 3
  retry_button_cap: 3
  fix_poll_interval_sec: 30
  coder_terminate_grace_sec: 5
  planned_pr_timeout_sec: 3600
  rate_limit_session_pause_percent: 95
  rate_limit_weekly_pause_percent: 100
  strict_queue_validation: true
  upload_staging_max_age_hours: 24
  usage_api_user_agent: claude-code/2.1.104
  usage_api_beta_header: oauth-2025-04-20
  usage_api_cache_ttl_sec: 60
  install_statusline_hook: true
  auto_fallback: true
  coder_priority:
    codex: 81
    claude: 76
  exploration_epsilon: 0.15
  coder: claude
  codex_model: ''
  github_api_pause_threshold_percent: 5
  github_api_slowdown_threshold_percent: 20
  github_api_slowdown_multiplier: 5
  idle_extended_poll_interval_sec: 300
  idle_extended_after_cycles: 3
  watch_slow_window_sec: 300
  watch_slow_poll_interval_sec: 300
  watch_fast_poll_interval_sec: 45
  watch_retrigger_cap: 3
  ci_pending_max_min: 30
  error_rate_threshold: 5
  error_rate_window_min: 60
  error_rate_auto_pause_enabled: true
  operator_active_hours_start: 9
  operator_active_hours_end: 21
  operator_timezone: Europe/Rome
web:
  host: 0.0.0.0
  port: 8000
auth:
  claude_config_dir: /data/auth/claude
  gh_config_dir: /data/auth/gh
  codex_home_dir: /data/auth
