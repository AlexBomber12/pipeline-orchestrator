[project]
name = "pipeline-orchestrator"
license = "Apache-2.0"

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/e2e", "tests-manual"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
