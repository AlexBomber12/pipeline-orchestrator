<div id="settings-github-usage" {% if usage_oob | default(false) %}hx-swap-oob="outerHTML"{% endif %} class="mt-4 grid gap-4 sm:grid-cols-2">
    {% for budget in github_usage | default([]) %}
    <div class="rounded border border-white/10 p-3" data-github-usage="{{ budget.label }}">
        <h3 class="text-sm font-medium text-gray-200">{{ budget.label }}</h3>
        {% if budget.status == 'available' %}
        <p class="mt-1 font-mono text-sm">{{ budget.remaining }} / {{ budget.limit }} remaining</p>
        <p class="mt-1 text-xs text-gray-500">{{ budget.reset_at | format_reset }}</p>
        {% else %}
        <p class="mt-1 text-sm text-gray-400">Current usage data unavailable</p>
        {% endif %}
    </div>
    {% endfor %}
</div>
