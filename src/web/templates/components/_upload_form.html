{% macro upload_form(repo, labelled=false) -%}
<form hx-post="/repos/{{ repo.name }}/upload-tasks"
      hx-encoding="multipart/form-data"
      hx-indicator="#upload-indicator-{{ css_escape(repo.name) }}"
      hx-target="{{ upload_feedback_target(repo.name) }}"
      hx-swap="innerHTML"
      hx-disabled-elt="#upload-{{ css_escape(repo.name) }}"
      class="inline-flex focus-within:outline focus-within:outline-accent">
    <input type="file" name="files" multiple accept=".md,.zip,application/zip,application/x-zip-compressed"
           onchange="this.form.requestSubmit()"
           class="sr-only" id="upload-{{ repo.name }}">
    <label for="upload-{{ repo.name }}"
           aria-label="Upload tasks"
           title="Upload tasks"
           class="relative inline-flex items-center justify-center {{ 'h-8 gap-2 px-3 md:h-7' if labelled else 'h-8 w-8 md:h-7 md:w-7' }} rounded-md text-gray-400 hover:text-white hover:bg-white/5 transition-colors cursor-pointer before:absolute before:-inset-1.5 before:content-[''] md:before:content-none">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" class="w-5 h-5">
            <path fill-rule="evenodd" d="M11.47 2.47a.75.75 0 0 1 1.06 0l4.5 4.5a.75.75 0 0 1-1.06 1.06l-3.22-3.22V16.5a.75.75 0 0 1-1.5 0V4.81L8.03 8.03a.75.75 0 0 1-1.06-1.06l4.5-4.5ZM3 15.75a.75.75 0 0 1 .75.75v2.25a1.5 1.5 0 0 0 1.5 1.5h13.5a1.5 1.5 0 0 0 1.5-1.5V16.5a.75.75 0 0 1 1.5 0v2.25a3 3 0 0 1-3 3H5.25a3 3 0 0 1-3-3V16.5a.75.75 0 0 1 .75-.75Z" clip-rule="evenodd" />
        </svg>
        {% if labelled %}<span>Upload tasks</span>{% endif %}
    </label>
</form>
{%- endmacro %}
