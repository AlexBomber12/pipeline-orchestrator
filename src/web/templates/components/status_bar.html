{# Dashboard stats strip for the index page. #}
<div class="rounded-lg border border-white/5 bg-surface-2 p-3">
    <div class="grid grid-cols-2 sm:grid-cols-4 items-center gap-x-6 gap-y-2 text-sm">
        <div>
            <span class="font-mono font-semibold text-white">{{ stats.active }}</span>
            <span class="text-gray-500 text-xs uppercase tracking-wide ml-1">Working</span>
        </div>
        <div>
            <span class="font-mono font-semibold {% if stats.alerts > 0 %}text-fail{% else %}text-white{% endif %}">{{ stats.alerts }}</span>
            <span class="{% if stats.alerts > 0 %}text-fail/80{% else %}text-gray-500{% endif %} text-xs uppercase tracking-wide ml-1">Needs your action</span>
        </div>
        {% for key, label in [('paused', 'Paused'), ('idle', 'Idle')] %}
        <div>
            <span class="font-mono font-semibold text-white">{{ stats[key] }}</span>
            <span class="text-gray-500 text-xs uppercase tracking-wide ml-1">{{ label }}</span>
        </div>
        {% endfor %}
    </div>
</div>
