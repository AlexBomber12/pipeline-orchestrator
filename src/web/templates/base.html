<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark light">
    <title>{% block title %}Pipeline Orchestrator{% endblock %}</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script>
        document.addEventListener('htmx:configRequest', function () {});
        document.addEventListener('htmx:beforeSwap', function (evt) {
            const status = evt.detail.xhr.status;
            if (status === 400 || status === 404 || status === 409 || status === 422 || status === 503) {
                evt.detail.shouldSwap = true;
                evt.detail.isError = false;
            }
        });
    </script>

    <link rel="icon" id="favicon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%2312121a'/><text x='16' y='21' text-anchor='middle' font-family='monospace' font-size='12' font-weight='bold' fill='%2322d3ee'>PO</text></svg>">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">

    <script>
        (function () {
            const STORAGE_KEY = 'theme';
            let theme = 'dark';
            let storedTheme = null;

            try {
                storedTheme = localStorage.getItem(STORAGE_KEY);
            } catch (_error) {}

            if (storedTheme === 'light' || storedTheme === 'dark') {
                theme = storedTheme;
            } else if (
                window.matchMedia &&
                window.matchMedia('(prefers-color-scheme: light)').matches
            ) {
                theme = 'light';
            }

            document.documentElement.dataset.theme = theme;
            document.documentElement.style.colorScheme = theme;
        })();
    </script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'surface-1': '#0a0a0f',
                        'surface-2': '#12121a',
                        'surface-3': '#1a1a25',
                        'accent': '#22d3ee',
                        'ok': '#34d399',
                        'warn': '#fbbf24',
                        'fail': '#f87171',
                        'hung': '#a78bfa',
                    },
                    fontFamily: {
                        'sans': ['"DM Sans"', 'system-ui', 'sans-serif'],
                        'mono': ['"JetBrains Mono"', 'ui-monospace', 'monospace'],
                    },
                },
            },
        };
    </script>

    <style>
        :root {
            color-scheme: dark;
        }

        :root,
        html[data-theme="dark"] {
            --bg-0: #0a0a0f;
            --bg-1: #12121a;
            --bg-2: #1a1a25;
            --bg-2-rgb: 26 26 37;
            --text-0: #f5f7fb;
            --text-1: #d1d5db;
            --text-2: #9ca3af;
            --text-3: #6b7280;
            --text-4: #4b5563;
            --border-soft: rgba(255, 255, 255, 0.05);
            --border-strong: rgba(255, 255, 255, 0.1);
            --neutral-rgb: 107 114 128;
            --accent: #22d3ee;
            --accent-rgb: 34 211 238;
            --ok: #34d399;
            --warn: #fbbf24;
            --fail: #f87171;
            --hung: #a78bfa;
            --log-bg: #020617;
            --log-fg: #4ade80;
            --cause-crash: #fb923c;
            --cause-escalate: #f87171;
            --cause-timeout: #fbbf24;
            --cause-infra: #60a5fa;
            --cause-operator: #9ca3af;
            --cause-deadlock: #a78bfa;
        }

        html[data-theme="light"] {
            --bg-0: #f5f7fb;
            --bg-1: #ffffff;
            --bg-2: #e7ebf3;
            --bg-2-rgb: 231 235 243;
            --text-0: #111827;
            --text-1: #1f2937;
            --text-2: #475569;
            --text-3: #64748b;
            --text-4: #94a3b8;
            --border-soft: rgba(15, 23, 42, 0.08);
            --border-strong: rgba(15, 23, 42, 0.14);
            --neutral-rgb: 100 116 139;
            --accent: #0891b2;
            --accent-rgb: 8 145 178;
            --ok: #059669;
            --warn: #b45309;
            --fail: #dc2626;
            --hung: #7c3aed;
            --log-bg: #e2e8f0;
            --log-fg: #166534;
            --cause-crash: #c2410c;
            --cause-escalate: #dc2626;
            --cause-timeout: #b45309;
            --cause-infra: #1d4ed8;
            --cause-operator: #475569;
            --cause-deadlock: #7c3aed;
        }

        html {
            background-color: var(--bg-0);
        }

        body {
            font-family: 'DM Sans', system-ui, sans-serif;
            background-color: var(--bg-0);
            color: var(--text-1);
            transition: background-color 0.15s ease, color 0.15s ease;
        }

        .font-mono,
        code,
        pre {
            font-family: 'JetBrains Mono', ui-monospace, monospace;
        }

        .bg-surface-1 {
            background-color: var(--bg-0) !important;
        }

        .bg-surface-2 {
            background-color: var(--bg-1) !important;
        }

        .bg-surface-3,
        .bg-surface-3\/40,
        .bg-surface-3\/60 {
            background-color: rgb(var(--bg-2-rgb) / 1) !important;
        }

        .bg-surface-3\/40 {
            background-color: rgb(var(--bg-2-rgb) / 0.4) !important;
        }

        .bg-surface-3\/60 {
            background-color: rgb(var(--bg-2-rgb) / 0.6) !important;
        }

        .bg-accent\/10 {
            background-color: rgb(var(--accent-rgb) / 0.1) !important;
        }

        .bg-accent\/20 {
            background-color: rgb(var(--accent-rgb) / 0.2) !important;
        }

        .border-white\/5 {
            border-color: var(--border-soft) !important;
        }

        .border-white\/10 {
            border-color: var(--border-strong) !important;
        }

        .divide-white\/5 > :not([hidden]) ~ :not([hidden]) {
            border-color: var(--border-soft) !important;
        }

        .border-accent\/30 {
            border-color: rgb(var(--accent-rgb) / 0.3) !important;
        }

        .border-accent\/40 {
            border-color: rgb(var(--accent-rgb) / 0.4) !important;
        }

        .text-accent {
            color: var(--accent) !important;
        }

        .text-accent\/70 {
            color: rgb(var(--accent-rgb) / 0.7) !important;
        }

        .text-white,
        .text-gray-100,
        .text-gray-200 {
            color: var(--text-0) !important;
        }

        .text-gray-300 {
            color: var(--text-1) !important;
        }

        .text-gray-400 {
            color: var(--text-2) !important;
        }

        .text-gray-500 {
            color: var(--text-3) !important;
        }

        .text-gray-600,
        .placeholder\:text-gray-600::placeholder {
            color: var(--text-3) !important;
        }

        .bg-gray-500 {
            background-color: rgb(var(--neutral-rgb) / 1) !important;
        }

        .bg-gray-500\/10 {
            background-color: rgb(var(--neutral-rgb) / 0.1) !important;
        }

        .border-gray-500\/30 {
            border-color: rgb(var(--neutral-rgb) / 0.3) !important;
        }

        .bg-ok {
            background-color: var(--ok) !important;
        }

        .bg-ok\/10 {
            background-color: color-mix(in srgb, var(--ok) 10%, transparent) !important;
        }

        .text-ok {
            color: var(--ok) !important;
        }

        .border-ok\/30 {
            border-color: color-mix(in srgb, var(--ok) 30%, transparent) !important;
        }

        .bg-warn {
            background-color: var(--warn) !important;
        }

        .bg-warn\/10 {
            background-color: color-mix(in srgb, var(--warn) 10%, transparent) !important;
        }

        .text-warn {
            color: var(--warn) !important;
        }

        .border-warn\/30 {
            border-color: color-mix(in srgb, var(--warn) 30%, transparent) !important;
        }

        .bg-fail {
            background-color: var(--fail) !important;
        }

        .text-fail {
            color: var(--fail) !important;
        }

        .text-fail\/80 {
            color: color-mix(in srgb, var(--fail) 80%, transparent) !important;
        }

        .text-hung {
            color: var(--hung) !important;
        }

        .bg-black {
            background-color: var(--log-bg) !important;
        }

        .text-green-400 {
            color: var(--log-fg) !important;
        }

        .hover\:bg-surface-3:hover {
            background-color: rgb(var(--bg-2-rgb) / 1) !important;
        }

        .hover\:bg-accent\/10:hover {
            background-color: rgb(var(--accent-rgb) / 0.1) !important;
        }

        .hover\:bg-accent\/20:hover {
            background-color: rgb(var(--accent-rgb) / 0.2) !important;
        }

        .hover\:border-white\/10:hover {
            border-color: var(--border-strong) !important;
        }

        .hover\:border-accent\/30:hover {
            border-color: rgb(var(--accent-rgb) / 0.3) !important;
        }

        .hover\:border-accent\/40:hover {
            border-color: rgb(var(--accent-rgb) / 0.4) !important;
        }

        .hover\:text-gray-200:hover {
            color: var(--text-0) !important;
        }

        .hover\:text-accent:hover {
            color: var(--accent) !important;
        }

        .focus\:border-accent:focus {
            border-color: var(--accent) !important;
        }

        /* Shared hover treatments for interactive elements. */
        .primary-interactive {
            transition-property: color, background-color, border-color;
            transition-duration: 150ms;
            transition-timing-function: ease;
        }

        .primary-interactive:hover {
            border-color: rgb(var(--accent-rgb) / 0.5) !important;
            background-color: color-mix(in srgb, var(--text-0) 5%, transparent) !important;
        }

        .secondary-interactive {
            transition: color 150ms ease;
        }

        .secondary-interactive:hover {
            color: var(--accent) !important;
        }

        .pulse-dot {
            opacity: 1;
            transition: opacity 1s ease-in-out;
        }

        .pulse-dot.dim {
            opacity: 0.3;
        }

        .pulse-badge {
            opacity: 1;
            box-shadow: 0 0 8px 0 currentColor;
            transition: box-shadow 1s ease-in-out, opacity 1s ease-in-out;
        }

        .pulse-badge.dim {
            opacity: 0.75;
            box-shadow: 0 0 0 0 transparent;
        }

        /* Resource chip row: four compact indicators replacing the legacy
           single GitHub API budget bar. Color zone reflects percent
           remaining; `none` is a neutral grey for missing data. */
        .resource-chip-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .resource-chip {
            display: inline-flex;
            align-items: baseline;
            gap: 6px;
            padding: 3px 10px;
            border-radius: 999px;
            font-family: 'JetBrains Mono', ui-monospace, monospace;
            font-size: 11px;
            line-height: 1.4;
            border: 1px solid transparent;
            white-space: nowrap;
            cursor: default;
        }

        .resource-chip-label {
            font-weight: 500;
        }

        .resource-chip-value {
            font-weight: 600;
        }

        .resource-chip[data-zone="green"] {
            background-color: color-mix(in srgb, var(--ok) 18%, transparent);
            border-color: color-mix(in srgb, var(--ok) 35%, transparent);
            color: var(--ok);
        }

        .resource-chip[data-zone="amber"] {
            background-color: color-mix(in srgb, var(--warn) 18%, transparent);
            border-color: color-mix(in srgb, var(--warn) 35%, transparent);
            color: var(--warn);
        }

        .resource-chip[data-zone="red"] {
            background-color: color-mix(in srgb, var(--fail) 18%, transparent);
            border-color: color-mix(in srgb, var(--fail) 35%, transparent);
            color: var(--fail);
        }

        .resource-chip[data-zone="none"] {
            background-color: rgb(var(--neutral-rgb) / 0.12);
            border-color: rgb(var(--neutral-rgb) / 0.3);
            color: var(--text-3);
        }

        .global-spinner {
            position: fixed;
            top: 88px;
            right: 16px;
            z-index: 50;
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 5px 10px;
            border: 1px solid var(--border-strong);
            border-radius: 999px;
            background-color: rgb(var(--bg-2-rgb) / 0.92);
            color: var(--text-2);
            box-shadow: 0 10px 30px rgb(0 0 0 / 0.24);
            opacity: 0;
            pointer-events: none;
            transform: translateY(-4px);
            transition: opacity 0.15s ease, transform 0.15s ease;
        }

        .global-spinner.is-active,
        body.htmx-request #global-spinner {
            opacity: 1;
            transform: translateY(0);
        }

        .global-spinner-dot {
            width: 14px;
            height: 14px;
            border-radius: 999px;
            border: 2px solid rgb(var(--accent-rgb) / 0.25);
            border-top-color: var(--accent);
            animation: global-spinner-spin 0.8s linear infinite;
        }

        @keyframes global-spinner-spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* PR-254: cancellation cards on the per-repo detail page. Color
           tokens are defined per-theme so the left border, badge, and
           label all share the category color and remain readable in
           both light and dark themes. */
        .cancellation-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .cancellation-card {
            border: 1px solid var(--border-soft);
            border-left-width: 3px;
            border-radius: 6px;
            background-color: var(--bg-1);
            padding: 10px 12px;
            font-size: 13px;
        }

        .cancellation-header {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            gap: 8px;
            margin-bottom: 6px;
        }

        .cancellation-header .category-badge {
            font-family: 'JetBrains Mono', ui-monospace, monospace;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.04em;
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid currentColor;
            background-color: color-mix(in srgb, currentColor 12%, transparent);
        }

        .cancellation-header .task-id {
            font-size: 12px;
            color: var(--text-1);
        }

        .cancellation-header .cancellation-time {
            margin-left: auto;
            font-size: 11px;
            color: var(--text-3);
        }

        .cancellation-payload {
            display: flex;
            flex-direction: column;
            gap: 2px;
            color: var(--text-2);
        }

        .cancellation-payload .cancellation-stderr {
            margin-top: 4px;
            padding: 6px 8px;
            border-radius: 4px;
            background-color: var(--log-bg);
            color: var(--log-fg);
            font-family: 'JetBrains Mono', ui-monospace, monospace;
            font-size: 11px;
            white-space: pre-wrap;
            word-break: break-word;
            max-height: 8rem;
            overflow-y: auto;
        }

        .cancellation-payload .cancellation-reason {
            color: var(--text-1);
            white-space: pre-wrap;
            word-break: break-word;
        }

        .cancellation-card.category-crash {
            border-left-color: var(--cause-crash);
        }
        .cancellation-card.category-crash .category-badge {
            color: var(--cause-crash);
        }

        .cancellation-card.category-escalate {
            border-left-color: var(--cause-escalate);
        }
        .cancellation-card.category-escalate .category-badge {
            color: var(--cause-escalate);
        }

        .cancellation-card.category-timeout {
            border-left-color: var(--cause-timeout);
        }
        .cancellation-card.category-timeout .category-badge {
            color: var(--cause-timeout);
        }

        .cancellation-card.category-infra {
            border-left-color: var(--cause-infra);
        }
        .cancellation-card.category-infra .category-badge {
            color: var(--cause-infra);
        }

        .cancellation-card.category-operator_recovery {
            border-left-color: var(--cause-operator);
        }
        .cancellation-card.category-operator_recovery .category-badge {
            color: var(--cause-operator);
        }

        .cancellation-card.category-no_push_deadlock {
            border-left-color: var(--cause-deadlock);
        }
        .cancellation-card.category-no_push_deadlock .category-badge {
            color: var(--cause-deadlock);
        }

        /* PR-232: dark-theme select option styling. Native <option> styling has
           limited cross-browser support; Firefox on Linux may ignore these
           rules. Chrome and Safari honor them. */
        html[data-theme="dark"] select option {
            background-color: #1f2937;
            color: #e5e7eb;
        }

        html[data-theme="dark"] select option:checked {
            background-color: #374151;
            color: #ffffff;
        }

        html[data-theme="dark"] select option:hover {
            background-color: #374151;
        }

        /* PR-256: Human Availability chip in the dashboard top bar.
           3-state (AUTO/AVAILABLE/AWAY) with the dot color reflecting
           the composed verdict and the label reflecting the manual
           override. Click cycles through states. */
        .availability-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 999px;
            border: 1px solid var(--border-strong);
            background-color: rgb(var(--bg-2-rgb) / 1);
            color: var(--text-1);
            font-family: 'JetBrains Mono', ui-monospace, monospace;
            font-size: 11px;
            font-weight: 500;
            line-height: 1.4;
            cursor: pointer;
            user-select: none;
            transition: border-color 150ms ease, background-color 150ms ease;
        }

        .availability-chip:hover {
            border-color: rgb(var(--accent-rgb) / 0.5);
        }

        .availability-chip .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: rgb(var(--neutral-rgb) / 1);
        }

        .availability-chip[data-composed="AVAILABLE"] .dot {
            background-color: var(--ok);
            box-shadow: 0 0 6px 0 var(--ok);
        }

        .availability-chip[data-composed="AWAY"] .dot {
            background-color: var(--fail);
            box-shadow: 0 0 6px 0 var(--fail);
        }
    </style>
</head>
<body class="bg-surface-1 text-gray-200 min-h-screen">
    <nav class="border-b border-white/5 bg-surface-2">
        <div class="max-w-7xl mx-auto flex flex-col gap-3 px-4 py-3 sm:flex-row sm:items-center sm:justify-between sm:px-6 sm:py-4">
            <div class="flex min-w-0 items-center gap-3">
                <div class="w-9 h-9 rounded-md bg-accent/10 border border-accent/30 flex items-center justify-center">
                    <span class="font-mono text-accent text-sm font-semibold">PO</span>
                </div>
                <h1 class="min-w-0 truncate text-base font-semibold tracking-tight sm:text-lg">Pipeline Orchestrator</h1>
            </div>
            <div class="flex w-full flex-wrap items-center justify-between gap-3 sm:w-auto sm:justify-end sm:gap-6">
                <a href="/"
                   class="text-sm font-medium secondary-interactive {% if title == 'Settings' %}text-gray-400{% else %}text-accent{% endif %}">
                    Dashboard
                </a>
                <a href="/settings"
                   class="text-sm font-medium secondary-interactive {% if title == 'Settings' %}text-accent{% else %}text-gray-400{% endif %}">
                    Settings
                </a>
                <button
                    id="availability-chip"
                    type="button"
                    class="availability-chip"
                    data-composed="AVAILABLE"
                    data-manual="AUTO"
                    title="Click to cycle: AUTO → AVAILABLE → AWAY"
                    aria-label="Operator availability: AUTO">
                    <span class="dot" aria-hidden="true"></span>
                    <span class="label">AUTO</span>
                </button>
                <div id="clock" class="font-mono text-sm text-gray-400 sm:text-right">--:--:--</div>
            </div>
        </div>
    </nav>

    {% include "components/_global_spinner.html" %}

    <div hx-get="/partials/redis-banner"
         hx-trigger="every 30s"
         hx-swap="innerHTML"
         id="redis-banner"
         data-global-spinner="false">
        {% include "components/redis_banner.html" %}
    </div>

    <main class="max-w-7xl mx-auto px-4 py-6 sm:px-6 sm:py-8">
        {% block content %}{% endblock %}
    </main>

    <script>
        (function () {
            const STORAGE_KEY = 'theme';

            function applyTheme(theme, persist) {
                const button = document.getElementById('theme-toggle');
                const darkIcon = document.getElementById('theme-icon-dark');
                const lightIcon = document.getElementById('theme-icon-light');

                document.documentElement.dataset.theme = theme;
                document.documentElement.style.colorScheme = theme;

                if (persist) {
                    try {
                        localStorage.setItem(STORAGE_KEY, theme);
                    } catch (_error) {}
                }

                if (button) {
                    const nextTheme = theme === 'dark' ? 'light' : 'dark';
                    button.setAttribute('aria-label', `Switch to ${nextTheme} theme`);
                    button.setAttribute('title', `Switch to ${nextTheme} theme`);
                }

                if (darkIcon && lightIcon) {
                    darkIcon.classList.toggle('hidden', theme !== 'dark');
                    lightIcon.classList.toggle('hidden', theme !== 'light');
                }
            }

            applyTheme(document.documentElement.dataset.theme || 'dark', false);

            const button = document.getElementById('theme-toggle');

            if (button) {
                button.addEventListener('click', function () {
                    const currentTheme = document.documentElement.dataset.theme === 'light'
                        ? 'light'
                        : 'dark';
                    const nextTheme = currentTheme === 'dark' ? 'light' : 'dark';
                    applyTheme(nextTheme, true);
                });
            }
        })();
    </script>

    <script>
        (function () {
            const spinner = document.getElementById('global-spinner');
            if (!spinner) {
                return;
            }

            let activeRequests = 0;
            const countedRequests = new WeakSet();
            const triggeredElements = new WeakSet();

            function syncSpinner() {
                spinner.classList.toggle('is-active', activeRequests > 0);
                document.body.classList.toggle('htmx-request', activeRequests > 0);
            }

            document.body.addEventListener('htmx:trigger', function (event) {
                const triggerSpec = event.detail && event.detail.triggerSpec;
                if (triggerSpec && triggerSpec.pollInterval > 0) {
                    return;
                }

                if (event.target instanceof Element) {
                    triggeredElements.add(event.target);
                }
            });

            function shouldTrackRequest(event) {
                const elt = event.detail && event.detail.elt;
                const requestConfig = event.detail && event.detail.requestConfig;

                if (elt && elt.closest('[data-global-spinner="false"]')) {
                    triggeredElements.delete(elt);
                    return false;
                }

                if (requestConfig && requestConfig.triggeringEvent) {
                    return true;
                }

                if (elt && triggeredElements.has(elt)) {
                    triggeredElements.delete(elt);
                    return true;
                }

                return !elt;
            }

            document.body.addEventListener('htmx:beforeRequest', function (event) {
                if (!shouldTrackRequest(event)) {
                    return;
                }

                if (event.detail && event.detail.xhr) {
                    countedRequests.add(event.detail.xhr);
                }

                activeRequests += 1;
                syncSpinner();
            });

            document.body.addEventListener('htmx:afterRequest', function (event) {
                if (event.detail && event.detail.xhr) {
                    if (!countedRequests.has(event.detail.xhr)) {
                        return;
                    }
                    countedRequests.delete(event.detail.xhr);
                } else if (!shouldTrackRequest(event)) {
                    return;
                }

                activeRequests = Math.max(0, activeRequests - 1);
                syncSpinner();
            });

        })();
    </script>

    <script>
        (function () {
            let dim = false;
            function syncPulseDots() {
                document.querySelectorAll('.pulse-dot').forEach(dot => dot.classList.toggle('dim', dim));
                document.querySelectorAll('.pulse-badge').forEach(badge => badge.classList.toggle('dim', dim));
            }
            setInterval(() => {
                dim = !dim;
                syncPulseDots();
            }, 1000);
            document.body.addEventListener('htmx:afterSwap', syncPulseDots);
        })();
    </script>

    <script>
        (function () {
            const el = document.getElementById('clock');
            function tick() {
                const now = new Date();
                const hh = String(now.getHours()).padStart(2, '0');
                const mm = String(now.getMinutes()).padStart(2, '0');
                const ss = String(now.getSeconds()).padStart(2, '0');
                el.textContent = `${hh}:${mm}:${ss}`;
            }
            tick();
            setInterval(tick, 1000);
        })();
    </script>

    <script>
        function formatTimestamps() {
            function relativeTime(dt) {
                if (isNaN(dt)) return null;
                const diffMin = (Date.now() - dt.getTime()) / 60000;
                if (diffMin < -1440) return dt.toLocaleString([], {month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'});
                if (diffMin < -60) return 'in ' + Math.round(-diffMin / 60) + 'h';
                if (diffMin < -1) return 'in ' + Math.round(-diffMin) + ' min';
                if (diffMin < 1) return 'just now';
                if (diffMin < 60) return Math.round(diffMin) + ' min ago';
                if (diffMin < 1440) return Math.round(diffMin / 60) + 'h ago';
                return dt.toLocaleDateString([], {month: 'short', day: 'numeric'});
            }
            document.querySelectorAll('[data-ts]').forEach(el => {
                const ts = el.dataset.ts;
                if (!ts) return;
                const text = relativeTime(new Date(ts));
                if (text) el.textContent = text;
            });
            document.querySelectorAll('[data-ts-unix]').forEach(el => {
                const ts = parseInt(el.dataset.tsUnix, 10);
                if (isNaN(ts)) return;
                const text = relativeTime(new Date(ts * 1000));
                if (text) el.textContent = text;
            });
        }
        document.addEventListener('DOMContentLoaded', formatTimestamps);
        document.body.addEventListener('htmx:afterSwap', formatTimestamps);
    </script>

    <script>
        (function() {
            const originalTitle = document.title;
            let blinking = false;
            let blinkInterval = null;

            const normalFavicon = `data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" rx="6" fill="%2312121a"/><text x="16" y="21" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="%2322d3ee">PO</text></svg>`;
            const alertFavicon = `data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" rx="6" fill="%2312121a"/><text x="16" y="21" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="%2322d3ee">PO</text><circle cx="26" cy="6" r="5" fill="%23f87171"/></svg>`;

            function setFavicon(href) {
                const link = document.getElementById('favicon');
                if (link) link.href = href;
            }

            function checkAlerts() {
                fetch('/api/alerts')
                    .then(r => r.json())
                    .then(data => {
                        const hasAlert = !!data.has_alerts;
                        if (hasAlert && !blinking) {
                            startBlink();
                        } else if (!hasAlert && blinking) {
                            stopBlink();
                        }
                    })
                    .catch(() => {});
            }

            function startBlink() {
                blinking = true;
                setFavicon(alertFavicon);
                let show = true;
                blinkInterval = setInterval(() => {
                    document.title = show ? 'ALERT - Pipeline Orchestrator' : originalTitle;
                    show = !show;
                }, 1500);
            }

            function stopBlink() {
                blinking = false;
                if (blinkInterval) {
                    clearInterval(blinkInterval);
                    blinkInterval = null;
                }
                document.title = originalTitle;
                setFavicon(normalFavicon);
            }

            const checkAlertsIntervalId = setInterval(checkAlerts, 10000);
            window.addEventListener('beforeunload', () => clearInterval(checkAlertsIntervalId));
            checkAlerts();
        })();
    </script>

    <script>
        // PR-256: Human Availability chip. 3-state cycle AUTO → AVAILABLE
        // → AWAY → AUTO; ``data-composed`` drives the dot color (composed
        // verdict from server-side sources) while ``data-manual`` drives
        // the label and click-cycle next state so AUTO renders distinctly
        // from a pinned override that happens to resolve identically.
        (function () {
            const chip = document.getElementById('availability-chip');
            if (!chip) return;
            const cycle = {AUTO: 'AVAILABLE', AVAILABLE: 'AWAY', AWAY: 'AUTO'};

            function applyState(data) {
                if (!data || typeof data !== 'object') return;
                const composed = data.composed_state || 'AVAILABLE';
                const manual = data.manual_override || 'AUTO';
                chip.dataset.composed = composed;
                chip.dataset.manual = manual;
                chip.setAttribute('aria-label', 'Operator availability: ' + manual);
                const label = chip.querySelector('.label');
                if (label) label.textContent = manual;
            }

            async function refresh() {
                try {
                    const resp = await fetch('/api/availability');
                    if (!resp.ok) return;
                    applyState(await resp.json());
                } catch (_error) {}
            }

            // Serialize override updates so rapid repeat clicks reach
            // Redis in click order. Two concurrent POSTs would otherwise
            // race in the network/server stack: the older request can
            // be applied after the newer one, leaving Redis in a stale
            // state, and the trailing ``refresh()`` then pulls that
            // stale state back into the chip. Chaining each click onto
            // the previous tail enforces "one in flight at a time" and
            // also defers ``refresh()`` until after the queued POST so
            // it always reads the newest server-side value.
            let pendingChain = Promise.resolve();

            async function cycleState() {
                const current = chip.dataset.manual || 'AUTO';
                const next = cycle[current] || 'AUTO';
                // Advance the dataset (and label) optimistically BEFORE the
                // POST so a second click that lands while the first request
                // is still in flight sees the updated `current` and
                // continues the cycle (AUTO → AVAILABLE → AWAY → AUTO).
                // Without this the click handler would re-read the stale
                // `data-manual`, recompute the same `next`, and send a
                // duplicate transition. The dot color (data-composed)
                // stays at the last server-composed verdict until
                // ``refresh()`` reconciles; if the POST fails, ``refresh``
                // pulls the server's actual override back so the local
                // optimistic update gets reverted.
                chip.dataset.manual = next;
                chip.setAttribute('aria-label', 'Operator availability: ' + next);
                const label = chip.querySelector('.label');
                if (label) label.textContent = next;
                pendingChain = pendingChain.then(async () => {
                    try {
                        await fetch('/api/availability/' + next, {method: 'POST'});
                    } catch (_error) {}
                    await refresh();
                });
            }

            chip.addEventListener('click', cycleState);

            // 60s polling is the safety net: SSE wake fires immediately on
            // operator clicks, but heartbeat expiry and active-hours rollover
            // happen silently and need a periodic re-fetch to surface.
            const intervalId = setInterval(refresh, 60000);
            window.addEventListener('beforeunload', function () {
                clearInterval(intervalId);
                if (window._availabilitySource) {
                    try { window._availabilitySource.close(); } catch (_e) {}
                }
            });

            // SSE wake on availability change so all tabs sync without
            // waiting for the 60s poll. ``EventSource`` reconnects on its
            // own when the stream drops, so no manual retry loop is needed.
            try {
                const source = new EventSource('/api/availability/events');
                window._availabilitySource = source;
                source.addEventListener('availability_changed', function () {
                    refresh();
                });
            } catch (_error) {}

            refresh();
        })();
    </script>
