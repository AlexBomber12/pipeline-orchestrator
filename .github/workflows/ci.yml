name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write
  id-token: write

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Prepare /data runtime root
        run: |
          sudo mkdir -p /data/repos /data/uploads
          sudo chown -R "$(id -u):$(id -g)" /data
      - run: pip install -r requirements.txt -r requirements-test.txt
      - run: bash scripts/ci.sh

  integration:
    runs-on: ubuntu-latest
    needs: unit
    concurrency:
      group: integration-testbed-shared
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v4

      - name: Record tested checkout for setup failures
        run: |
          mkdir -p tests/e2e/evidence
          printf '{"tested_sha":"%s","status":"setup may not have reached pytest"}\n' "$(git rev-parse HEAD)" > tests/e2e/evidence/run.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt -r requirements-test.txt
      - run: playwright install --with-deps chromium
      - name: Build test stack image before issuing short-lived tokens
        id: build-test-stack
        run: docker compose -f docker-compose.test.yml build

      - name: Run integration batch 1/3 with fresh credentials
        # Keep the shared testbed lock for all batches and retain one required
        # integration check. Every batch runs even if an earlier one fails.
        if: ${{ !cancelled() && steps.build-test-stack.outcome == 'success' }}
        timeout-minutes: 45
        uses: ./.github/actions/testbed-batch
        with:
          batch: '1'
          app-id: ${{ secrets.TESTBED_APP_ID }}
          private-key: ${{ secrets.TESTBED_APP_PRIVATE_KEY }}
          reviewer-app-id: ${{ secrets.TESTBED_REVIEWER_APP_ID }}
          reviewer-private-key: ${{ secrets.TESTBED_REVIEWER_APP_PRIVATE_KEY }}

      - name: Run integration batch 2/3 with fresh credentials
        # Keep the shared testbed lock for all batches and retain one required
        # integration check. Every batch runs even if an earlier one fails.
        if: ${{ !cancelled() && steps.build-test-stack.outcome == 'success' }}
        timeout-minutes: 45
        uses: ./.github/actions/testbed-batch
        with:
          batch: '2'
          app-id: ${{ secrets.TESTBED_APP_ID }}
          private-key: ${{ secrets.TESTBED_APP_PRIVATE_KEY }}
          reviewer-app-id: ${{ secrets.TESTBED_REVIEWER_APP_ID }}
          reviewer-private-key: ${{ secrets.TESTBED_REVIEWER_APP_PRIVATE_KEY }}

      - name: Run integration batch 3/3 with fresh credentials
        # Keep the shared testbed lock for all batches and retain one required
        # integration check. Every batch runs even if an earlier one fails.
        if: ${{ !cancelled() && steps.build-test-stack.outcome == 'success' }}
        timeout-minutes: 45
        uses: ./.github/actions/testbed-batch
        with:
          batch: '3'
          app-id: ${{ secrets.TESTBED_APP_ID }}
          private-key: ${{ secrets.TESTBED_APP_PRIVATE_KEY }}
          reviewer-app-id: ${{ secrets.TESTBED_REVIEWER_APP_ID }}
          reviewer-private-key: ${{ secrets.TESTBED_REVIEWER_APP_PRIVATE_KEY }}

      - name: Verify every collected test belonged to exactly one batch
        if: ${{ !cancelled() && steps.build-test-stack.outcome == 'success' }}
        run: python -m tests.e2e.lib.pytest_batches

      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-evidence
          path: |
            tests/e2e/evidence/
            stack-logs.txt
          retention-days: 14
          if-no-files-found: ignore

      - name: Tear down test stack
        if: always()
        run: docker compose -f docker-compose.test.yml down -v
