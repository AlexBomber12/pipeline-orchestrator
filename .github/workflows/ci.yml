name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write
  id-token: write

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Prepare /data runtime root
        run: |
          sudo mkdir -p /data/repos /data/uploads
          sudo chown -R "$(id -u):$(id -g)" /data
      - run: pip install -r requirements.txt -r requirements-test.txt
      - run: bash scripts/ci.sh

  integration:
    runs-on: ubuntu-latest
    needs: unit
    concurrency:
      group: integration-testbed-shared
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - id: testbed-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.TESTBED_APP_ID }}
          private-key: ${{ secrets.TESTBED_APP_PRIVATE_KEY }}
          owner: AlexBomber12
          repositories: pipeline-orchestrator-testbed

      - name: Require independent reviewer App credentials
        env:
          HAS_REVIEWER_APP_ID: ${{ secrets.TESTBED_REVIEWER_APP_ID != '' }}
          HAS_REVIEWER_APP_PRIVATE_KEY: ${{ secrets.TESTBED_REVIEWER_APP_PRIVATE_KEY != '' }}
        run: |
          if [[ "$HAS_REVIEWER_APP_ID" != "true" || "$HAS_REVIEWER_APP_PRIVATE_KEY" != "true" ]]; then
            echo "::error::Missing TESTBED_REVIEWER_APP_ID or TESTBED_REVIEWER_APP_PRIVATE_KEY; see docs/ci-setup.md"
            exit 1
          fi

      - id: testbed-reviewer-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.TESTBED_REVIEWER_APP_ID }}
          private-key: ${{ secrets.TESTBED_REVIEWER_APP_PRIVATE_KEY }}
          owner: AlexBomber12
          repositories: pipeline-orchestrator-testbed

      - name: Verify gh auth
        env:
          GH_TOKEN: ${{ steps.testbed-token.outputs.token }}
        run: gh api repos/AlexBomber12/pipeline-orchestrator-testbed --jq .full_name

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt -r requirements-test.txt

      - name: Prepare integration reviewer config
        id: prepare-test-reviewer
        env:
          GH_TOKEN: ${{ steps.testbed-reviewer-token.outputs.token }}
          TESTBED_REVIEWER_APP_SLUG: ${{ steps.testbed-reviewer-token.outputs.app-slug }}
        run: |
          python scripts/prepare_test_reviewer_config.py \
            --app-slug "$TESTBED_REVIEWER_APP_SLUG" \
            --config config.test.yml \
            --github-output "$GITHUB_OUTPUT"

      - run: playwright install --with-deps chromium

      - name: Build test stack image
        run: docker compose -f docker-compose.test.yml build

      - name: Initialize codex-auth-test volume
        run: bash scripts/init-test-volume.sh

      - name: Seed gh auth for in-container shim
        env:
          TESTBED_TOKEN: ${{ steps.testbed-token.outputs.token }}
        run: |
          mkdir -p tests/e2e/data/auth/gh tests/e2e/data/repos tests/e2e/data/uploads
          cat > tests/e2e/data/auth/gh/hosts.yml <<EOF
          github.com:
              user: x-access-token
              oauth_token: ${TESTBED_TOKEN}
              git_protocol: https
          EOF
          cat > tests/e2e/data/auth/.gitconfig <<EOF
          [url "https://x-access-token:${TESTBED_TOKEN}@github.com/"]
              insteadOf = https://github.com/
          EOF
          chmod 600 tests/e2e/data/auth/gh/hosts.yml
          chmod 600 tests/e2e/data/auth/.gitconfig
          mkdir -p tests/e2e/data/events
          sudo chown -R 1000:1000 tests/e2e/data/auth tests/e2e/data/repos tests/e2e/data/uploads tests/e2e/data/events

      - name: Bring up test stack
        run: docker compose -f docker-compose.test.yml up -d --wait

      - name: Verify shim is mounted in daemon-test
        run: |
          actual=$(docker compose -f docker-compose.test.yml exec -T daemon-test which claude)
          if [ "$actual" != "/usr/local/bin/claude" ]; then
            echo "ERROR: shim not mounted; daemon-test which claude returned: $actual" >&2
            echo "Expected /usr/local/bin/claude. Check docker-compose.test.yml volume mounts and PATH env." >&2
            exit 1
          fi
          echo "OK: shim mounted at $actual"

      - name: Verify prepared reviewer config in test services
        env:
          EXPECTED_REVIEWER_ID: ${{ steps.prepare-test-reviewer.outputs.user-id }}
          EXPECTED_REVIEWER_LOGIN: ${{ steps.prepare-test-reviewer.outputs.login }}
        run: |
          for service in web-test daemon-test; do
            docker compose -f docker-compose.test.yml exec -T \
              -e "EXPECTED_REVIEWER_ID=$EXPECTED_REVIEWER_ID" \
              -e "EXPECTED_REVIEWER_LOGIN=$EXPECTED_REVIEWER_LOGIN" \
              "$service" python -c '
          import os
          from src.config import load_config

          expected_id = int(os.environ["EXPECTED_REVIEWER_ID"])
          expected_login = os.environ["EXPECTED_REVIEWER_LOGIN"].casefold()
          identities = load_config().daemon.trusted_reviewer_identities
          if not any(
              identity.user_id == expected_id
              and identity.login.casefold() == expected_login
              for identity in identities
          ):
              raise SystemExit("prepared reviewer identity is missing")
          '
            echo "OK: $service loaded the prepared reviewer identity"
          done

      - name: Run e2e tests
        env:
          GH_TOKEN: ${{ steps.testbed-token.outputs.token }}
          TESTBED_REVIEWER_TOKEN: ${{ steps.testbed-reviewer-token.outputs.token }}
        run: pytest tests/e2e/ -v

      - name: Capture stack logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.test.yml logs > stack-logs.txt 2>&1 || true
          cat stack-logs.txt || true

      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-evidence
          path: |
            tests/e2e/evidence/
            stack-logs.txt
          retention-days: 14
          if-no-files-found: ignore

      - name: Tear down test stack
        if: always()
        run: docker compose -f docker-compose.test.yml down -v
