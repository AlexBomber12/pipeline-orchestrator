services:
  web:
    build: .
    entrypoint: ["bash", "scripts/entrypoint.sh"]
    command: uvicorn src.web.app:app --app-dir /app --host 0.0.0.0 --port 8000
    user: "1000:1000"
    mem_limit: 2g
    ports:
      - "${WEB_PORT:-8800}:8000"
    volumes:
      - .:/app
      - ./data:/data
      - codex-auth:/data/auth/.codex
    environment:
      REDIS_URL: redis://redis:6379/0
      CLAUDE_CONFIG_DIR: /data/auth/claude
      GH_CONFIG_DIR: /data/auth/gh
      HOME: /data/auth
    restart: unless-stopped
    depends_on:
      - redis

  daemon:
    build: .
    command: python -m src.daemon.main
    user: "1000:1000"
    mem_limit: 8g
    volumes:
      - .:/app:ro
      - ./data:/data
      - codex-auth:/data/auth/.codex
    environment:
      REDIS_URL: redis://redis:6379/0
      CLAUDE_CONFIG_DIR: /data/auth/claude
      GH_CONFIG_DIR: /data/auth/gh
      HOME: /data/auth
    restart: unless-stopped
    depends_on:
      - redis

  mcp:
    build: .
    command: python -m src.mcp.server
    user: "1000:1000"
    mem_limit: 1g
    ports:
      - "127.0.0.1:${MCP_PORT:-5173}:5173"
    volumes:
      - .:/app:ro
      - ./data/repos:/data/repos:ro
    environment:
      PYTHONUNBUFFERED: "1"
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    profiles:
      - cloudflared
    env_file:
      - path: .cloudflared.env
        required: false
    mem_limit: 256m
    restart: unless-stopped
    depends_on:
      - mcp

  redis:
    image: redis:7-alpine
    mem_limit: 1g
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  codex-auth:
  redis_data:
