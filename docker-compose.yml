services:
  events-init:
    build: .
    entrypoint: ["sh", "-c"]
    command: ["install -d -o 1000 -g 1000 -m 0750 /events"]
    user: "0:0"
    volumes:
      - ${PO_EVENTS_HOST_DIR:-./data/events}:/events
    restart: "no"

  web:
    build: .
    entrypoint: ["bash", "scripts/entrypoint.sh"]
    command: uvicorn src.web.app:app --app-dir /app --host 0.0.0.0 --port 8000
    user: "1000:1000"
    mem_limit: 2g
    ports:
      - "${WEB_PORT:-8800}:8000"
    volumes:
      - .:/app
      - ./data:/data
      - ${PO_EVENTS_HOST_DIR:-./data/events}:${PO_EVENTS_DIR:-/data/events}
      - codex-auth:/data/auth/.codex
    environment:
      REDIS_URL: redis://redis:6379/0
      PO_EVENTS_DIR: ${PO_EVENTS_DIR:-/data/events}
      CLAUDE_CONFIG_DIR: /data/auth/claude
      GH_CONFIG_DIR: /data/auth/gh
      HOME: /data/auth
    restart: unless-stopped
    depends_on:
      events-init:
        condition: service_completed_successfully
      redis:
        condition: service_started

  daemon:
    build: .
    command: python -m src.daemon.main
    user: "1000:1000"
    mem_limit: 8g
    volumes:
      - .:/app:ro
      - ./data:/data
      - ${PO_EVENTS_HOST_DIR:-./data/events}:${PO_EVENTS_DIR:-/data/events}
      - codex-auth:/data/auth/.codex
    environment:
      REDIS_URL: redis://redis:6379/0
      PO_EVENTS_DIR: ${PO_EVENTS_DIR:-/data/events}
      CLAUDE_CONFIG_DIR: /data/auth/claude
      GH_CONFIG_DIR: /data/auth/gh
      HOME: /data/auth
    restart: unless-stopped
    depends_on:
      events-init:
        condition: service_completed_successfully
      redis:
        condition: service_started

  mcp:
    build: .
    command: python -m src.mcp
    user: "1000:1000"
    mem_limit: 1g
    ports:
      - "127.0.0.1:${MCP_PORT:-5173}:5173"
    volumes:
      - .:/app:ro
      - ./data/repos:/data/repos:ro
      - ${PO_EVENTS_HOST_DIR:-./data/events}:${PO_EVENTS_DIR:-/data/events}:ro
    environment:
      PYTHONUNBUFFERED: "1"
      REDIS_URL: redis://redis:6379/0
      PO_EVENTS_DIR: ${PO_EVENTS_DIR:-/data/events}
    restart: unless-stopped
    depends_on:
      events-init:
        condition: service_completed_successfully
      redis:
        condition: service_started

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    profiles:
      - cloudflared
    env_file:
      - path: .cloudflared.env
        required: false
    mem_limit: 256m
    restart: unless-stopped
    depends_on:
      - mcp

  redis:
    image: redis:7-alpine
    mem_limit: 1g
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  codex-auth:
  redis_data:
